[project]
name = "ting-baby-agent"
version = "0.1.0"
description = "汀宝宝 AI 对话主入口服务"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# 格式化器（Black 风格）：与上面 lint 共用 line-length = 100，保存时自动跑
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.basedpyright]
executionEnvironments = [{ root = "." }]
